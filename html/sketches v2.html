<!DOCTYPE html>

<head>

<meta name="viewport"
content="width=device-width, initial scale=1.0">

    <title>Sketches .1</title>
    <style>
        Body {
            Background-color: dimgray;
        }
        h1 {
            color: midnightblue;
            margin-left: 30px;
        }
        img{ opacity: 0.2; 
        }
        img:hover {opacity: 1.0;
        } 
          

* {
  margin: 0;
  padding: 0:
  box-sizing: border-box;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start:
  padding:0 15px;
}

.gallery-item {
  position: relative;
  width: 200;
  height: auto;
  margin: 50px;
  cursor:pointer;
  transition: transform 0.5s ease;
}

.gallery-item:hover {
  transform: scale(1.1);
}

/* The Modal (background) */
.modal {
  display:none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0);
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s ease <!-- change --!>

}

/* Modal content (image) */
.modal-content {
  position:relative;
  width: 90%;
  height: auto;
  max-width: 90%;
  max-height: 90%;
  border-radius: 5px;
  overflow: hidden;
  animation:zoomIn 0.5s <!-- change --!>

@keyframes zoonIn {
   from {transform: scale(0.6);}
   to {transform: scale(1);}
}

.modal.show {
  display: flex;
  opacity: 1;
}

/* Close button */
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  color: white;
  font-size: 35px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.3s;
}

/* Caption of modal image */
.caption {
    position: absolute;
    bottom: 15px;
    width: 100%
    text-align: center;
    color: #ffffff;
    font-siza: 24px;
}


@media screen and (max-width: 768px)
{
  .gallery-item {
     width: calc(100% - 20px);
    }
}   

@media screen and (max-width: 480px) 
{
  .gallery-item {
     width: calc(100% - 20px);
    }
}

    </style>

</head>

<body>

<div class="gallery">

  <img src="panther_ring.jpg" alt="Cartier Panther Ring" class="gallery-item"
         onclick="openModal('modal1')" width="600" height= "auto">

 
  <img src="dolls.jpg" alt= "Dolls" class="gallery-item"
         onclick="openModal('modal2')" width="600" height= "auto">


  <img src="boxcopy.jpg" alt="Box" class="gallery-item"
         onclick="openModal('modal3')" width="600" height= "auto">
</div>

<div id="modal1" class="modal">
   <span class="close" onclick="closeModal('modal1')">&times;</span>
   <img src="panther_ring.jpg" class="modal-content">
   <div class="caption"></div>
</div>

<div id="modal2" class="modal">
   <span class="close" onclick="closeModal('modal2')">&times;</span>
   <img src="dolls.jpg" alt="Dolls" class="modal-content">
   <div class="caption"></div>
</div>


<div id="modal3" class="modal">
   <span class="close" onclick="closeModal('modal3')">&times;</span>
   <img src="boxcopy.jpg" alt="Box" class="modal-content">
   <div class="caption"></div>
</div>

<script>
function openModal(modalId, caption) {
  let modal = document.getElementById(modalId);
  modal.style.display = "flex";
  modal.classList.add("show");
}

function closeModal(modalId) {
   let modal = document.getElementById(modalId);
   modal.classList.remove("show");
   setTimeout(function () {
      modal.style.display = "none";
}
</script>
